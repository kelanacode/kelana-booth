name = "photo-booth-gallery"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Custom domain (ruangkelana.com zone is on Cloudflare). The workers.dev URL
# stays enabled so links/QR codes from older sessions keep working.
workers_dev = true
routes = [
  { pattern = "gallery.ruangkelana.com", custom_domain = true }
]

# Create the bucket first: `wrangler r2 bucket create photo-booth-gallery`
# Then update bucket_name to match your account's bucket if you renamed it.
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "photo-booth-gallery"

# Supabase server SDK config. SUPABASE_SECRET_KEY is a secret: set it locally
# in .dev.vars and remotely with `wrangler secret put SUPABASE_SECRET_KEY`.
[vars]
SUPABASE_URL = "https://wxctgsodatmqnizchadn.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gd8kDrcS8O9KO7es4OItgw_WoQNUb0e"
SUPABASE_JWKS_URL = "https://wxctgsodatmqnizchadn.supabase.co/auth/v1/.well-known/jwks.json"
# Base URL for the /q?t= links in WhatsApp messages.
GALLERY_PUBLIC_URL = "https://gallery.ruangkelana.com"

# Guest queue over WhatsApp. Set these secrets once the booth number is on the
# WhatsApp Cloud API (wrangler secret put <NAME>):
#   WA_TOKEN            permanent access token (system user)
#   WA_PHONE_NUMBER_ID  the number's Phone Number ID from Meta
#   WA_VERIFY_TOKEN     any string; enter the same one in Meta's webhook settings
#   WA_APP_SECRET       Meta app secret (webhook signature check)
#   QUEUE_WA_SECRET     must equal queue_settings.wa_secret in the database
# Webhook URL to enter in Meta: https://gallery.ruangkelana.com/api/wa/webhook

# Safety net: send any WhatsApp turn message the database ping missed.
[triggers]
crons = ["* * * * *"]